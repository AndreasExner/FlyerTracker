<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>LostDogTracer – Equipment-Karte</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <style>
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff; border-radius: 14px; padding: 1.75rem;
            max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
        }
        .modal h3 { margin-bottom: 0.25rem; font-size: 1.125rem; }
        .modal .modal-sub { color: #6e6e73; font-size: 0.8125rem; margin-bottom: 1rem; }
        .modal-buttons { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
        .eq-loc-item {
            padding: 0.75rem; border: 1px solid #e8e8ed; border-radius: 10px;
            margin-bottom: 0.5rem;
        }
        .eq-loc-item strong { display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; }
        .eq-loc-item small { display: block; color: #6e6e73; font-size: 0.8125rem; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="site-banner">Hundesuchhilfe-Ostfriesland e.V.</div>
    <div class="admin-container" style="max-width: 1200px;">
        <div class="admin-header">
            <h1>📷 Equipment-Karte</h1>
            <a href="equipment.html" class="btn-back">Zurück</a>
        </div>

        <div class="map-info">
            <span class="badge" id="markerCount">0 Standorte</span>
        </div>

        <div id="map"></div>

        <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Modal: units at location -->
    <div class="modal-overlay" id="eqLocModal">
        <div class="modal">
            <h3 id="eqLocTitle">Standort</h3>
            <p class="modal-sub" id="eqLocSub"></p>
            <div id="eqLocList"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary btn-sm" id="eqLocClose">Schließen</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/auth.js"></script>
    <script>
        FT_AUTH.requireRole(2);
    </script>
    <script src="js/equipment-map.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
