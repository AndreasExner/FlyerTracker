<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>LostDogTracer – Karte</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <style>
        .cat-filter { position: relative; }
        .cat-filter-btn {
            padding: 0.35rem 0.5rem; font-size: 0.8125rem; border: 1px solid #d2d2d7;
            border-radius: 8px; background: #fff; color: #1d1d1f; cursor: pointer; white-space: nowrap;
        }
        .cat-filter-panel {
            position: absolute; top: calc(100% + 4px); left: 0; z-index: 1200;
            background: #fff; border: 1px solid #d2d2d7; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 0.5rem; min-width: 200px;
            max-height: 300px; overflow-y: auto;
        }
        .cat-filter-panel.hidden { display: none; }
        .cat-filter-actions { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .cat-filter-actions button {
            flex: 1; padding: 0.3rem; font-size: 0.75rem; border: 1px solid #d2d2d7;
            border-radius: 6px; background: #f5f5f7; color: #1d1d1f; cursor: pointer;
        }
        .cat-filter-list label {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.2rem;
            font-size: 0.85rem; color: #1d1d1f; cursor: pointer;
        }
        .cat-filter-list input { width: auto; margin: 0; }
    </style>
</head>
<body>
    <div class="site-banner">Hundesuchhilfe-Ostfriesland e.V.</div>
    <div class="admin-container" style="max-width: 1200px;">
        <div class="admin-header">
            <h1>📍 Karte</h1>
            <a href="owner-home.html" class="btn-back" id="backLink">Zurück</a>
        </div>

        <div class="map-info">
            <span class="badge" id="filterInfo"></span>
            <span class="badge" id="markerCount">0 Standorte</span>
            <div class="cat-filter" id="catFilter">
                <button type="button" class="cat-filter-btn" id="catFilterBtn">Kategorien: alle ▾</button>
                <div class="cat-filter-panel hidden" id="catFilterPanel">
                    <div class="cat-filter-actions">
                        <button type="button" id="catSelectAll">Alle</button>
                        <button type="button" id="catSelectNone">Keine</button>
                    </div>
                    <div class="cat-filter-list" id="catFilterList"></div>
                </div>
            </div>
            <label class="toggle-badge" title="Laufroute anzeigen">
                <input type="checkbox" id="toggleRoutes"> Routen
            </label>
            <label class="toggle-badge" title="Live-Standort anzeigen">
                <input type="checkbox" id="toggleLocation"> 📍 Mein Standort
            </label>
        </div>
        <div class="legend" id="legend"></div>

        <div id="map"></div>

        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (function() {
            var p = new URLSearchParams(location.search);
            var key = p.get('key');
            if (key) document.getElementById('backLink').href = 'owner-home.html?key=' + encodeURIComponent(key);
        })();
    </script>
    <script src="js/svg-icons.js"></script>
    <script src="js/owner-map.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/owner-nav.js"></script>
</body>
</html>
